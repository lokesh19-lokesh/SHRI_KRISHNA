<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031958" />
      <stop offset="100%" stop-color="#010d30" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7A97B" />
      <stop offset="100%" stop-color="#AC895B" />
    </linearGradient>
  </defs>
  <rect width="500" height="380" rx="16" fill="url(#cosBg)"/>
  
  <!-- Aesthetic Radiance Background Arc -->
  <path d="M 120,260 Q 250,330 380,260" fill="none" stroke="#C7A97B" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Aesthetic Symmetrical Smile Teeth -->
  <g fill="#ffffff" stroke="#C7A97B" stroke-width="1.5">
    <path d="M 175,170 C 180,130 205,130 210,170 L 210,210 C 205,215 180,215 175,210 Z" />
    <path d="M 215,160 C 220,115 245,115 250,160 L 250,215 C 245,220 220,220 215,215 Z" />
    <path d="M 255,160 C 260,115 285,115 290,160 L 290,215 C 285,220 260,220 255,215 Z" />
    <path d="M 295,170 C 300,130 325,130 330,170 L 330,210 C 325,215 300,215 295,210 Z" />
  </g>

  <!-- Sparkle & Diamond Aesthetic Accents -->
  <g fill="url(#goldGrad)" transform="translate(130, 110)">
    <path d="M 20,0 L 25,15 L 40,20 L 25,25 L 20,40 L 15,25 L 0,20 L 15,15 Z"/>
  </g>
  <g fill="url(#goldGrad)" transform="translate(340, 95) scale(0.8)">
    <path d="M 20,0 L 25,15 L 40,20 L 25,25 L 20,40 L 15,25 L 0,20 L 15,15 Z"/>
  </g>

  <text x="250" y="325" text-anchor="middle" fill="#ffffff" font-family="'Cinzel', serif" font-size="16" font-weight="600" letter-spacing="1">COSMETIC &amp; SMILE ENHANCEMENT</text>
  <text x="250" y="350" text-anchor="middle" fill="#C7A97B" font-family="'Montserrat', sans-serif" font-size="12">Veneers, Whitening &amp; Esthetics</text>
</svg>
