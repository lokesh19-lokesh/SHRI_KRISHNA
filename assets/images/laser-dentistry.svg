<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="laserBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031958" />
      <stop offset="100%" stop-color="#010d30" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7A97B" />
      <stop offset="100%" stop-color="#AC895B" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7A97B" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#C7A97B" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="500" height="380" rx="16" fill="url(#laserBg)"/>
  
  <!-- Tooth Silhouette Target -->
  <path d="M 270,160 C 290,140 330,140 350,160 C 370,180 370,220 355,250 C 340,280 325,300 315,300 C 305,300 300,280 300,260 C 300,280 295,300 285,300 C 275,300 260,280 245,250 C 230,220 230,180 250,160 Z" fill="#f8fafc" stroke="#C7A97B" stroke-width="2"/>

  <!-- Dental Laser Handpiece Device -->
  <g transform="translate(100, 60) rotate(35)">
    <rect x="0" y="0" width="160" height="24" rx="6" fill="#08298a" stroke="#C7A97B" stroke-width="2"/>
    <rect x="160" y="7" width="50" height="10" rx="3" fill="url(#goldGrad)"/>
    <polygon points="210,8 235,12 210,16" fill="#ffffff" stroke="#C7A97B" stroke-width="1"/>
  </g>

  <!-- Focused Laser Beam Ray -->
  <line x1="220" y1="135" x2="310" y2="200" stroke="#C7A97B" stroke-width="3" stroke-dasharray="2,3"/>
  <circle cx="310" cy="200" r="10" fill="url(#beamGrad)" />
  <circle cx="310" cy="200" r="4" fill="#ffffff" />

  <text x="250" y="340" text-anchor="middle" fill="#ffffff" font-family="'Cinzel', serif" font-size="16" font-weight="600" letter-spacing="1">MINIMALLY INVASIVE LASER DENTISTRY</text>
</svg>
