<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <defs>
    <linearGradient id="orthoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031958" />
      <stop offset="100%" stop-color="#010d30" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7A97B" />
      <stop offset="100%" stop-color="#AC895B" />
    </linearGradient>
  </defs>

  <rect width="500" height="380" rx="16" fill="url(#orthoBg)"/>
  <circle cx="250" cy="190" r="140" fill="url(#goldGrad)" opacity="0.08"/>

  <!-- Five Aligned Teeth -->
  <g fill="#ffffff" stroke="#C7A97B" stroke-width="2">
    <rect x="75" y="110" width="55" height="120" rx="14"/>
    <rect x="145" y="95" width="60" height="135" rx="16"/>
    <rect x="220" y="85" width="60" height="145" rx="18"/>
    <rect x="295" y="95" width="60" height="135" rx="16"/>
    <rect x="370" y="110" width="55" height="120" rx="14"/>
  </g>

  <!-- Orthodontic Brackets (Gold) -->
  <g fill="url(#goldGrad)" stroke="#031958" stroke-width="1.5">
    <rect x="87" y="155" width="30" height="30" rx="4"/>
    <rect x="160" y="155" width="30" height="30" rx="4"/>
    <rect x="235" y="155" width="30" height="30" rx="4"/>
    <rect x="310" y="155" width="30" height="30" rx="4"/>
    <rect x="382" y="155" width="30" height="30" rx="4"/>
  </g>

  <!-- Precision Slots -->
  <g fill="#031958">
    <rect x="89" y="168" width="26" height="4"/>
    <rect x="162" y="168" width="26" height="4"/>
    <rect x="237" y="168" width="26" height="4"/>
    <rect x="312" y="168" width="26" height="4"/>
    <rect x="384" y="168" width="26" height="4"/>
  </g>

  <!-- Archwire -->
  <path d="M 50,170 Q 250,165 450,170" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 50,170 Q 250,165 450,170" fill="none" stroke="#C7A97B" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Text -->
  <text x="250" y="300" text-anchor="middle" fill="#ffffff" font-family="Cinzel, serif" font-size="16" font-weight="700" letter-spacing="1">PRECISION ORTHODONTICS</text>
  <text x="250" y="325" text-anchor="middle" fill="#C7A97B" font-family="Montserrat, sans-serif" font-size="12" font-weight="500">Alignment &amp; Malocclusion Solutions</text>
</svg>
