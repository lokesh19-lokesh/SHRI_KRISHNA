<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="orthoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031958" />
      <stop offset="100%" stop-color="#010d30" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7A97B" />
      <stop offset="100%" stop-color="#AC895B" />
    </linearGradient>
  </defs>
  <rect width="500" height="380" rx="16" fill="url(#orthoBg)"/>
  <circle cx="250" cy="190" r="140" fill="url(#goldGrad)" opacity="0.06"/>

  <!-- Row of Aligned Teeth -->
  <g fill="#ffffff" stroke="#C7A97B" stroke-width="1.5">
    <rect x="75" y="120" width="55" height="110" rx="14"/>
    <rect x="145" y="110" width="60" height="125" rx="16"/>
    <rect x="220" y="100" width="60" height="135" rx="18"/>
    <rect x="295" y="110" width="60" height="125" rx="16"/>
    <rect x="370" y="120" width="55" height="110" rx="14"/>
  </g>

  <!-- Precision Orthodontic Brackets (Gold Accent) -->
  <g fill="url(#goldGrad)" stroke="#031958" stroke-width="1.5">
    <rect x="87" y="160" width="30" height="28" rx="4"/>
    <rect x="160" y="160" width="30" height="28" rx="4"/>
    <rect x="235" y="160" width="30" height="28" rx="4"/>
    <rect x="310" y="160" width="30" height="28" rx="4"/>
    <rect x="382" y="160" width="30" height="28" rx="4"/>
  </g>

  <!-- Orthodontic Archwire -->
  <path d="M 50,174 Q 250,165 450,174" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  
  <text x="250" y="310" text-anchor="middle" fill="#ffffff" font-family="'Cinzel', serif" font-size="16" font-weight="600" letter-spacing="1">PRECISION ORTHODONTICS</text>
  <text x="250" y="335" text-anchor="middle" fill="#C7A97B" font-family="'Montserrat', sans-serif" font-size="12">Alignment & Malocclusion Solutions</text>
</svg>
