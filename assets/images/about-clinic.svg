  <path d="M 50,340 L 550,340" stroke="#C7A97B" stroke-width="2"/>
  <rect x="100" y="140" width="400" height="200" rx="12" fill="#08216b" stroke="#C7A97B" stroke-width="1.5" opacity="0.6"/>
  
