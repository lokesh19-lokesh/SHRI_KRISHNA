  <line x1="150" y1="140" x2="150" y2="340" stroke="#C7A97B" stroke-width="2" stroke-dasharray="3,4"/>
  <line x1="450" y1="140" x2="450" y2="340" stroke="#C7A97B" stroke-width="2" stroke-dasharray="3,4"/>

  <!-- Hospital Brand Crest -->
  <circle cx="300" cy="110" r="45" fill="#031958" stroke="#C7A97B" stroke-width="2.5"/>
  <path d="M 290,90 C 295,85 305,85 310,90 C 318,95 318,105 315,115 C 312,122 308,130 304,130 C 302,130 300,122 300,118 C 300,122 298,130 296,130 C 292,130 288,122 285,115 C 282,105 282,95 290,90 Z" fill="url(#goldGrad)" />

  <text x="300" y="180" text-anchor="middle" fill="#ffffff" font-family="'Cinzel', serif" font-size="14" font-weight="700" letter-spacing="1">SHRI KRISHNA DENTAL HOSPITAL</text>
  <text x="300" y="200" text-anchor="middle" fill="#C7A97B" font-family="'Montserrat', sans-serif" font-size="11">Excellence in Advanced Dental Care</text>
